name: CI/CD bluetooth-traffic

on:
  push:
    paths:
      - "bluetooth-traffic/**"
      - ".github/workflows/ci-bluetooth-traffic.yml"
      - "!*.md"

env:
  WORKING_DIRECTORY: bluetooth-traffic
  PROJECT_NAME: odh-mobility-el-bluetooth-traffic
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/odh-mobility-el-bluetooth-traffic
  DOCKER_TAG: ${{ github.sha }}
  JAVA_VERSION: "21"
  KUBERNETES_NAMESPACE: collector
  K8S_NAME: odh-mobility-el-bluetooth-traffic

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5
      - name: Test code
        uses: noi-techpark/github-actions/maven-test@v2
        with:
          java-version: ${{ env.JAVA_VERSION }}
          working-directory: ${{ env.WORKING_DIRECTORY }}
          test-command: "mvn -B -U clean compile test"
      - name: Lint Helm chart
        run: helm lint ${{ env.WORKING_DIRECTORY }}/infrastructure/helm
      - name: Validate Helm templates (test)
        run: helm template ${{ env.K8S_NAME }} ${{ env.WORKING_DIRECTORY }}/infrastructure/helm -f ${{ env.WORKING_DIRECTORY }}/infrastructure/helm/test.yaml
      - name: Validate Helm templates (prod)
        run: helm template ${{ env.K8S_NAME }} ${{ env.WORKING_DIRECTORY }}/infrastructure/helm -f ${{ env.WORKING_DIRECTORY }}/infrastructure/helm/prod.yaml

  build:
    runs-on: ubuntu-24.04
    needs: test
    concurrency: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build project
        uses: noi-techpark/github-actions/maven-build@v2
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}
          java-version: ${{ env.JAVA_VERSION }}
          build-command: "mvn -B -DskipTests clean package"

      - name: Build and push images
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          working-directory: ${{ env.WORKING_DIRECTORY }}/infrastructure
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}

  deploy-test:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency: deploy-test-bluetooth-traffic
    environment: test
    env:
      VALUES_YAML: infrastructure/helm/test.yaml
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Customize values.yaml
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          yq -i '.image.repository = "${{ env.DOCKER_IMAGE }}"' ${{ env.VALUES_YAML }}
          yq -i '.image.tag = "${{ env.DOCKER_TAG }}"' ${{ env.VALUES_YAML }}
          yq -i '.image.pullPolicy = "IfNotPresent"' ${{ env.VALUES_YAML }}
          yq -i '.envSecret.JDBC_URL = "jdbc:postgresql://${{ secrets.DB_URL_TEST }}:5432/bdp?user=${{ secrets.DB_USER_TEST }}&password=${{ secrets.DB_PWD_TEST }}"' ${{ env.VALUES_YAML }}

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: ${{ env.K8S_NAME }}
          k8s-namespace: ${{ env.KUBERNETES_NAMESPACE }}
          chart-path: ${{ env.WORKING_DIRECTORY }}/infrastructure/helm
          values-file: ${{ env.WORKING_DIRECTORY }}/${{ env.VALUES_YAML }}
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_KEY_SECRET }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

  deploy-prod:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/prod'
    concurrency: deploy-prod-bluetooth-traffic
    environment: prod
    env:
      VALUES_YAML: infrastructure/helm/prod.yaml
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Customize values.yaml
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          yq -i '.image.repository = "${{ env.DOCKER_IMAGE }}"' ${{ env.VALUES_YAML }}
          yq -i '.image.tag = "${{ env.DOCKER_TAG }}"' ${{ env.VALUES_YAML }}
          yq -i '.image.pullPolicy = "IfNotPresent"' ${{ env.VALUES_YAML }}
          yq -i '.envSecret.JDBC_URL = "jdbc:postgresql://${{ secrets.DB_URL_PROD }}:5432/bdp?user=${{ secrets.DB_USER_PROD }}&password=${{ secrets.DB_PWD_PROD }}"' ${{ env.VALUES_YAML }}

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v2
        with:
          k8s-name: ${{ env.K8S_NAME }}
          k8s-namespace: ${{ env.KUBERNETES_NAMESPACE }}
          chart-path: ${{ env.WORKING_DIRECTORY }}/infrastructure/helm
          values-file: ${{ env.WORKING_DIRECTORY }}/${{ env.VALUES_YAML }}
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_KEY_SECRET }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
