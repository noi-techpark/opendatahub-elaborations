#
# Each job runs on its own cron schedule via supercronic. Set *_CRON_SCHEDULE
# in the environment (or .env) to override the defaults below.
#
# ./data is bind-mounted at /app/data in every job container and holds the
# SQLite cache (parking.db); ./data/result holds result.json, served by nginx.
# Delete ./data/parking.db to reset the cache and start ingesting/training
# from scratch.
#
# One-shot execution (useful for testing):
#   docker compose run --rm ingest
#   docker compose run --rm train
#   docker compose run --rm predict

services:
  ingest:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: build
    image: parking-forecast
    env_file:
      - .env
    environment:
      CRON_SCHEDULE: ${INGEST_CRON_SCHEDULE:-*/15 * * * *}
    command: ["/app/ingest"]
    volumes:
      - ./data:/app/data

  train:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: build
    image: parking-forecast
    env_file:
      - .env
    environment:
      CRON_SCHEDULE: ${TRAIN_CRON_SCHEDULE:-0 0 * * *}
    command: ["/app/train"]
    volumes:
      - ./data:/app/data

  predict:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: build
    image: parking-forecast
    env_file:
      - .env
    environment:
      CRON_SCHEDULE: ${PREDICT_CRON_SCHEDULE:-0 3-23 * * *}
      RESULT_JSON_PATH: /app/data/result/result.json
    command: ["/app/predict"]
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:latest
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - ./data/result:/usr/share/nginx/html:ro
